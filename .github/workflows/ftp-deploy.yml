name: Deploy site via FTP

on:
  push:
    branches: [main]
    paths:
      - "website-31b44a6c-99ca-4509-be31-d200a4dc7bcd/**"
  workflow_dispatch: {}

jobs:
  ftp-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Uploads only the static site files below into public_html/.
      # The exclude list protects the existing WordPress install: nothing
      # under wp-admin/wp-content/wp-includes, and none of the WP root
      # files, is ever touched or deleted by this workflow.
      - name: FTP Deploy
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: 217.21.91.80
          username: u471136946.visda.keerthanasv.com
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftp
          port: 21
          local-dir: ./website-31b44a6c-99ca-4509-be31-d200a4dc7bcd/
          server-dir: ./public_html/
          exclude: |
            **/.git*
            **/.git*/**
            **/wp-admin/**
            **/wp-content/**
            **/wp-includes/**
            **/wp-config.php
            **/.htaccess
            **/wp-login.php
            **/wp-cron.php
            **/xmlrpc.php
            **/license.txt
            **/readme.html

      # WordPress leaves .htaccess untouched by the step above (it's excluded
      # so WP's own rewrite rules survive). Apache's default DirectoryIndex
      # order tries index.php before index.html, so the site root would still
      # load WordPress. This prepends a DirectoryIndex override that makes
      # index.html win at the root, without deleting anything WordPress added.
      - name: Prioritize static index.html at the site root
        env:
          FTP_HOST: 217.21.91.80
          FTP_USER: u471136946.visda.keerthanasv.com
          FTP_PASS: ${{ secrets.FTP_PASSWORD }}
        run: |
          set -e
          curl -s --user "$FTP_USER:$FTP_PASS" "ftp://$FTP_HOST/public_html/.htaccess" -o current.htaccess || true
          touch current.htaccess
          if grep -q "^DirectoryIndex" current.htaccess; then
            sed 's/^DirectoryIndex.*/DirectoryIndex index.html index.php/' current.htaccess > new.htaccess
          else
            { echo "DirectoryIndex index.html index.php"; echo; cat current.htaccess; } > new.htaccess
          fi
          curl -s --user "$FTP_USER:$FTP_PASS" -T new.htaccess "ftp://$FTP_HOST/public_html/.htaccess"
