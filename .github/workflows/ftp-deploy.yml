name: Deploy site via FTP

on:
  push:
    branches: [main]
    paths:
      - "website-31b44a6c-99ca-4509-be31-d200a4dc7bcd/**"
  workflow_dispatch: {}

jobs:
  ftp-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Uploads only the static site files below into public_html/.
      # The exclude list protects the existing WordPress install: nothing
      # under wp-admin/wp-content/wp-includes, and none of the WP root
      # files, is ever touched or deleted by this workflow.
      - name: FTP Deploy
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: 217.21.91.80
          username: u471136946.visda.keerthanasv.com
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftp
          port: 21
          local-dir: ./website-31b44a6c-99ca-4509-be31-d200a4dc7bcd/
          server-dir: ./public_html/
          exclude: |
            **/.git*
            **/.git*/**
            **/wp-admin/**
            **/wp-content/**
            **/wp-includes/**
            **/wp-config.php
            **/.htaccess
            **/wp-login.php
            **/wp-cron.php
            **/xmlrpc.php
            **/license.txt
            **/readme.html

      # WordPress leaves .htaccess untouched by the step above (it's excluded
      # so WP's own rewrite rules survive). A DirectoryIndex override alone
      # can be silently ignored if the host's AllowOverride doesn't grant the
      # "Indexes" category, even though WP's own RewriteRules (FileInfo
      # category) still work. So force the root to index.html with a
      # mod_rewrite rule instead -- the same mechanism WordPress's own block
      # relies on -- placed before WordPress's catch-all so it wins only for
      # the exact "/" request and never touches any other URL.
      - name: Prioritize static index.html at the site root
        env:
          FTP_HOST: 217.21.91.80
          FTP_USER: u471136946.visda.keerthanasv.com
          FTP_PASS: ${{ secrets.FTP_PASSWORD }}
        run: |
          set -e
          curl -s --user "$FTP_USER:$FTP_PASS" "ftp://$FTP_HOST/public_html/.htaccess" -o current.htaccess || true
          touch current.htaccess
          echo "--- current .htaccess on server ---"
          cat current.htaccess
          echo "--- end current .htaccess ---"

          START="# BEGIN static-homepage-override"
          END="# END static-homepage-override"

          # Drop any block we added on a previous run so re-runs stay idempotent.
          awk -v s="$START" -v e="$END" '
            $0==s {skip=1}
            !skip {print}
            $0==e {skip=0}
          ' current.htaccess > stripped.htaccess

          {
            echo "$START"
            echo "RewriteEngine On"
            echo "RewriteBase /"
            echo "RewriteRule ^\$ index.html [L]"
            echo "$END"
            echo
            cat stripped.htaccess
          } > new.htaccess

          echo "--- new .htaccess to upload ---"
          cat new.htaccess
          echo "--- end new .htaccess ---"

          curl -s --user "$FTP_USER:$FTP_PASS" -T new.htaccess "ftp://$FTP_HOST/public_html/.htaccess"

      # Read-only sanity check: confirm the live root actually serves the
      # static homepage now, from a runner with normal internet access
      # (this doesn't touch the server, just fetches what a visitor gets).
      # Also probes whether the server-side LiteSpeed page cache (seen
      # returning "x-litespeed-cache: hit" with stale WordPress content)
      # is the blocker, by trying a cache-busting query and a purge header.
      - name: Verify homepage
        run: |
          sleep 3
          echo "=== 1) plain request to / ==="
          curl -sS -D page1_headers.txt -o page1.html "https://visda.keerthanasv.com/" --max-time 20 || true
          cat page1_headers.txt || true
          echo "--- first 15 lines of body ---"
          head -15 page1.html || true

          echo
          echo "=== 2) cache-busting query string ==="
          curl -sS -D - -o page2.html "https://visda.keerthanasv.com/?nocache=$(date +%s)" --max-time 20 || true
          echo "--- first 15 lines of body ---"
          head -15 page2.html || true

          echo
          echo "=== 3) are our uploaded files reachable at all? ==="
          for p in /index.html /about.html /classes.html; do
            code=$(curl -sS -o body.html -w "%{http_code}" "https://visda.keerthanasv.com$p" --max-time 20 || echo "ERR")
            echo "$p -> HTTP $code"
            grep -o "<title>[^<]*</title>" body.html | head -1 || true
          done

      # Map the FTP tree so we can tell WHICH directory actually serves this
      # subdomain. On Hostinger a subdomain usually has its own docroot (e.g.
      # domains/<subdomain>/public_html), so files put in the account's top
      # public_html may never be served.
      - name: Map FTP directory layout
        env:
          FTP_HOST: 217.21.91.80
          FTP_USER: u471136946.visda.keerthanasv.com
          FTP_PASS: ${{ secrets.FTP_PASSWORD }}
        run: |
          for d in / /public_html/ /domains/ /domains/visda.keerthanasv.com/ /domains/visda.keerthanasv.com/public_html/; do
            echo "=== listing $d ==="
            curl -sS --user "$FTP_USER:$FTP_PASS" "ftp://$FTP_HOST$d" --max-time 25 || echo "(could not list $d)"
            echo
          done
