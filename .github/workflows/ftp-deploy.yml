name: Deploy site via FTP

on:
  push:
    branches: [main]
    paths:
      - "website-31b44a6c-99ca-4509-be31-d200a4dc7bcd/**"
  workflow_dispatch: {}

jobs:
  ftp-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Uploads only the static site files below into public_html/.
      # The exclude list protects the existing WordPress install: nothing
      # under wp-admin/wp-content/wp-includes, and none of the WP root
      # files, is ever touched or deleted by this workflow.
      - name: FTP Deploy
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: 217.21.91.80
          username: u471136946.visda.keerthanasv.com
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftp
          port: 21
          local-dir: ./website-31b44a6c-99ca-4509-be31-d200a4dc7bcd/
          server-dir: ./public_html/
          exclude: |
            **/.git*
            **/.git*/**
            **/wp-admin/**
            **/wp-content/**
            **/wp-includes/**
            **/wp-config.php
            **/.htaccess
            **/wp-login.php
            **/wp-cron.php
            **/xmlrpc.php
            **/license.txt
            **/readme.html

      # The FTP root "/" is this subdomain's actual document root (it holds
      # wp-config.php, wp-admin, index.php...), so public_html is just a
      # subfolder inside it and the uploaded pages are only reachable under
      # /public_html/*. Serve them at the top level by rewriting in the ROOT
      # .htaccess. The rewrite fires only when the requested file really
      # exists inside public_html, so every WordPress route (wp-admin,
      # wp-login.php, permalinks, wp-json) falls through untouched.
      - name: Serve the static site at the document root
        env:
          FTP_HOST: 217.21.91.80
          FTP_USER: u471136946.visda.keerthanasv.com
          FTP_PASS: ${{ secrets.FTP_PASSWORD }}
        run: |
          set -e
          curl -s --user "$FTP_USER:$FTP_PASS" "ftp://$FTP_HOST/.htaccess" -o root.htaccess || true
          touch root.htaccess
          echo "--- current ROOT .htaccess (WordPress) ---"
          cat root.htaccess
          echo "--- end ---"

          # Keep a dated backup on the server before touching WordPress's file.
          curl -s --user "$FTP_USER:$FTP_PASS" -T root.htaccess \
            "ftp://$FTP_HOST/.htaccess.before-static-$(date +%Y%m%d-%H%M%S)"

          START="# BEGIN static-site-root"
          END="# END static-site-root"

          awk -v s="$START" -v e="$END" '
            $0==s {skip=1}
            !skip {print}
            $0==e {skip=0}
          ' root.htaccess > stripped.htaccess

          {
            echo "$START"
            echo "<IfModule mod_rewrite.c>"
            echo "RewriteEngine On"
            echo "RewriteBase /"
            echo "RewriteRule ^\$ public_html/index.html [L]"
            echo "RewriteCond %{REQUEST_URI} !^/public_html/"
            echo "RewriteCond %{DOCUMENT_ROOT}/public_html%{REQUEST_URI} -f"
            echo "RewriteRule ^(.*)\$ public_html/\$1 [L]"
            echo "</IfModule>"
            echo "$END"
            echo
            cat stripped.htaccess
          } > new_root.htaccess

          echo "--- new ROOT .htaccess ---"
          cat new_root.htaccess
          echo "--- end ---"

          curl -s --user "$FTP_USER:$FTP_PASS" -T new_root.htaccess "ftp://$FTP_HOST/.htaccess"

          # Neutralise the earlier rule we put inside public_html so it can't
          # interfere now that rewriting happens at the document root.
          printf 'DirectoryIndex index.html index.php\n' > inner.htaccess
          curl -s --user "$FTP_USER:$FTP_PASS" -T inner.htaccess "ftp://$FTP_HOST/public_html/.htaccess"

      # Read-only sanity check: confirm the live root actually serves the
      # static homepage now, from a runner with normal internet access
      # (this doesn't touch the server, just fetches what a visitor gets).
      # Also probes whether the server-side LiteSpeed page cache (seen
      # returning "x-litespeed-cache: hit" with stale WordPress content)
      # is the blocker, by trying a cache-busting query and a purge header.
      - name: Verify homepage
        run: |
          sleep 3
          echo "=== 1) plain request to / ==="
          curl -sS -D page1_headers.txt -o page1.html "https://visda.keerthanasv.com/" --max-time 20 || true
          cat page1_headers.txt || true
          echo "--- first 15 lines of body ---"
          head -15 page1.html || true

          echo
          echo "=== 2) static pages at the top level ==="
          for p in / /about.html /classes.html /pricing.html /class/hot-yoga.html; do
            code=$(curl -sS -o body.html -w "%{http_code}" "https://visda.keerthanasv.com$p?cb=$(date +%s)" --max-time 20 || echo "ERR")
            echo -n "$p -> HTTP $code  "
            grep -o "<title>[^<]*</title>" body.html | head -1 || echo "(no title)"
          done

          echo
          echo "=== 3) WordPress routes must still work ==="
          for p in /wp-login.php /wp-admin/; do
            code=$(curl -sS -o /dev/null -w "%{http_code}" "https://visda.keerthanasv.com$p" --max-time 20 || echo "ERR")
            echo "$p -> HTTP $code"
          done

      # Map the FTP tree so we can tell WHICH directory actually serves this
      # subdomain. On Hostinger a subdomain usually has its own docroot (e.g.
      # domains/<subdomain>/public_html), so files put in the account's top
      # public_html may never be served.
      - name: Map FTP directory layout
        env:
          FTP_HOST: 217.21.91.80
          FTP_USER: u471136946.visda.keerthanasv.com
          FTP_PASS: ${{ secrets.FTP_PASSWORD }}
        run: |
          for d in / /public_html/ /domains/ /domains/visda.keerthanasv.com/ /domains/visda.keerthanasv.com/public_html/; do
            echo "=== listing $d ==="
            curl -sS --user "$FTP_USER:$FTP_PASS" "ftp://$FTP_HOST$d" --max-time 25 || echo "(could not list $d)"
            echo
          done
